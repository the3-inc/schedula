name: Deploy public demo
on:
  push:
    tags: ['web-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '公開または切り戻しする既存リリースタグ'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: public-demo-production
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: the3-inc/schedula/.github/workflows/publish-demo.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
