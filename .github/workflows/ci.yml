name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.select.outputs.python }}
      distribution: ${{ steps.select.outputs.distribution }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Select checks from the complete PR diff
        id: select
        run: python scripts/ci_checks.py select
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - name: Validate Ruff hooks and CI selection
        run: |
          uv run --locked pre-commit run --all-files --show-diff-on-failure
          bash -n scripts/deploy
          uv run --no-sync pytest -q -ra tests/test_ci_checks.py --junitxml=ci-tests.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as ET; assert not ET.parse('ci-tests.xml').findall('.//skipped')"
  timezone-distribution:
    needs: changes
    # matrixの必須チェック名を常に生成し、対象外PRはstepsだけを省略する。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.python == 'true'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.changes.outputs.python == 'true'
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Sync dependencies
        if: needs.changes.outputs.python == 'true'
        run: uv sync --locked
      - name: Validate timezone data, wheel dependencies, spawn control and pinned web assets
        if: needs.changes.outputs.python == 'true'
        run: uv run --no-sync pytest -q -ra tests/test_timezone.py tests/test_input_contract.py tests/test_execution.py tests/test_brand_preset.py --junitxml=test-results/timezone.xml
      - name: Reject skipped tests
        if: needs.changes.outputs.python == 'true'
        run: uv run --no-sync python -c "import xml.etree.ElementTree as ET; assert not ET.parse('test-results/timezone.xml').findall('.//skipped')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.python == 'true'
        with:
          name: timezone-${{ matrix.os }}
          path: test-results/
  python-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - name: Validate Python tests outside distribution
        run: uv run --no-sync pytest -q -ra -m 'not distribution' --junitxml=test-results/pytest.xml
      - name: Reject skipped tests
        run: uv run --no-sync python -c "import xml.etree.ElementTree as ET; assert not ET.parse('test-results/pytest.xml').findall('.//skipped')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results
          path: test-results/
  distribution:
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - name: Validate rebuilt distributions and isolated installation
        run: uv run --no-sync pytest -q -ra -m distribution --junitxml=test-results/distribution.xml
      - name: Reject skipped tests
        run: uv run --no-sync python -c "import xml.etree.ElementTree as ET; assert not ET.parse('test-results/distribution.xml').findall('.//skipped')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-results
          path: test-results/
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/playground-check" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/playground-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate playground and landing page in Chromium
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/playground-check/node_modules/playwright
        run: |
          node tests/playground-browser.cjs
          node tests/landing-browser.cjs
          node tests/public-browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: test-results/
  public-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
      - name: Verify the Linux Lambda container without AWS
        run: |
          uv build --wheel
          docker build --provenance=false --platform linux/amd64 -t schedula-demo:check -f web/Dockerfile .
          docker run --rm --read-only --tmpfs /tmp --entrypoint python schedula-demo:check -m web.smoke
  quality-checks:
    # 必須チェック名を維持し、必要なジョブの失敗・取消・意図しないskipを拒否する。
    needs: [changes, lint, timezone-distribution, python-tests, distribution, browser, public-deployment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Require all selected checks to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_checks.py check
