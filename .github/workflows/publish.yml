name: Publish to PyPI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: pypi
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Validate release tag, main ancestry and successful main CI
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          uv python install
          uv run --no-project python scripts/check_release.py
      - name: Build distributions and validate metadata
        run: |
          uv build --no-sources
          uvx twine check --strict dist/*
          uv run --no-project --isolated --with dist/*.whl python -I -m shift_schedula solve examples/roster.json
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/shift-schedula
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Verify artifacts and publish with OIDC
        run: |
          sha256sum --check dist/SHA256SUMS
          uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ dist/*.whl dist/*.tar.gz
